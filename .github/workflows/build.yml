name: Compilar APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Compilar APK de depuración
        run: ./gradlew --stacktrace :app:assembleGenericDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: davtasks-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Pruebas de sincronización CalDAV
        run: ./gradlew --stacktrace :kmp:jvmTest --tests 'org.tasks.caldav.*'

      - name: Publicar informe de pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: informe-pruebas
          path: kmp/build/reports/tests/
          if-no-files-found: ignore
